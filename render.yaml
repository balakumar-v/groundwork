# Render Blueprint: ONE web service that serves both the API and the frontend.
#
# Why one service: the login cookie is then first-party. If the frontend and
# backend sit on two different *.onrender.com hosts instead, Safari/iOS block
# the cookie and sign-in silently fails.
#
# Secrets marked `sync: false` are typed into Render's dashboard when you
# create the Blueprint; they are never committed here.
services:
  - type: web
    name: groundwork
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Postgres connection string (e.g. from Neon or Render Postgres)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: CHAT_MODEL
        sync: false # an OpenRouter chat model slug
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      - key: NODE_ENV
        value: production
      # CORS_ORIGIN is not needed: the app falls back to Render's own
      # RENDER_EXTERNAL_URL, and same-origin requests don't use CORS anyway.
      # Optional: set TEACHER_SIGNUP_CODE in the dashboard to require a code
      # for creating teacher accounts.
